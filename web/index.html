<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="card" aria-labelledby="phase-label">
  <p class="eyebrow" id="phase-label">focus</p>
  <p class="readout" id="timer-display" role="timer" aria-live="polite">25:00</p>
  <ul class="dots" id="cycle-dots" aria-label="position in the current cycle"></ul>
  <div class="controls">
    <button class="button primary" id="run-button" data-action="toggle" type="button">Start</button>
    <button class="button" id="skip-button" data-action="skip" type="button">Skip phase</button>
    <button class="button quiet" id="reset-button" data-action="reset" type="button">Reset</button>
    <button class="button quiet" id="sound-button" data-action="sound" type="button" aria-pressed="true">Sound on</button>
  </div>
  <p class="summary" id="session-summary">no focus phases finished yet</p>
  <p class="status" id="status-line" role="status" aria-live="polite"></p>
</main>
<script src="app.js"></script>
</body>
</html>
