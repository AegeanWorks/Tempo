<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" data-motif="timer" data-layout="wave">
  <title id="title">Tempo social preview</title>
  <desc id="desc">A focus timer you run on your own machine: one Python process, a browser page, no dependencies, no account and no network calls. Phases alternate focus and break, and every fourth break is a long one.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120d0d"/><stop offset="1" stop-color="#2d1919"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.12" r="0.95"><stop offset="0" stop-color="#fda4af" stop-opacity="0.28"/><stop offset="1" stop-color="#fda4af" stop-opacity="0"/></radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  
  <g opacity="0.15" stroke="#F8FAFC">
    <path d="M0 128H1280M0 256H1280M0 384H1280M0 512H1280M256 0V640M512 0V640M768 0V640M1024 0V640"/>
  </g>
  <g transform="translate(190 300) scale(2.0)" opacity="1.0"><circle cx="0" cy="8" r="46" fill="none" stroke="#fda4af" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M-16 -52H16M0 -52V-38" fill="none" stroke="#fda4af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 8V-16M0 8L24 22" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-46 8H-38M38 8H46M0 54V46" fill="none" stroke="#fda4af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="390" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" fill="#F8FAFC">Tempo</text><text x="392" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="21" letter-spacing="5" fill="#fda4af">AEGEANWORKS · WEB</text>
  <text x="392" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F8FAFC" fill-opacity="0.74">A focus timer you run on your own machine: one</text><text x="392" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F8FAFC" fill-opacity="0.74">Python process, a browser page, no dependencies,</text><text x="392" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F8FAFC" fill-opacity="0.74">no account and no network calls. Phases alternate</text>
  <rect x="392" y="500" width="76" height="38" rx="19" fill="#0B1220" fill-opacity="0.55" stroke="#94A3B8" stroke-opacity="0.35"/><text x="430.0" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F8FAFC" fill-opacity="0.82">aikit</text><rect x="500" y="500" width="96" height="38" rx="19" fill="#0B1220" fill-opacity="0.55" stroke="#94A3B8" stroke-opacity="0.35"/><text x="548.0" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F8FAFC" fill-opacity="0.82">browser</text><rect x="688" y="500" width="136" height="38" rx="19" fill="#0B1220" fill-opacity="0.55" stroke="#94A3B8" stroke-opacity="0.35"/><text x="756.0" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F8FAFC" fill-opacity="0.82">focus timer</text>
